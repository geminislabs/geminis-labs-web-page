name: Deploy Geminis Labs Web to EC2

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-to-ec2-test:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.EC2_SSH_KEY }}
          name: id_rsa
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for deployment
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: geminislabs-web:latest
          load: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          secrets: |
            VITE_RECAPTCHA_SITE_KEY=${{ vars.VITE_RECAPTCHA_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save geminislabs-web:latest | gzip > geminislabs-web.tar.gz

      - name: Copy Docker image to EC2
        run: |
          echo "Copiando imagen Docker al servidor..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa geminislabs-web.tar.gz ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_TEST }}:/tmp/
          echo "Copia completada."

      - name: Verify file transfer
        run: |
          echo "Verificando que el archivo se copió correctamente..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_TEST }} << 'EOF'
            if [ -f /tmp/geminislabs-web.tar.gz ]; then
              echo "✅ Archivo encontrado: /tmp/geminislabs-web.tar.gz"
              echo "Tamaño del archivo: $(du -h /tmp/geminislabs-web.tar.gz)"
              echo "Espacio disponible en /tmp: $(df -h /tmp | tail -1)"
            else
              echo "❌ Error: No se encontró el archivo /tmp/geminislabs-web.tar.gz"
              exit 1
            fi
          EOF

      - name: Deploy to EC2 Test Server
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST_TEST }} << 'EOF'
            set -e

            echo "=== Detener contenedor anterior ==="
            docker stop tracker-web-test || true
            docker rm tracker-web-test || true
            docker stop geminislabs-web || true
            docker rm geminislabs-web || true

            echo "=== Limpiando imágenes colgantes ==="
            # Esta EC2 es compartida con siscom-api, siscom-admin-api y Valkey.
            # `container prune` y `volume prune` barren todo el host y no
            # recuperaban nada nuestro: el contenedor de la web ya se borra por
            # nombre arriba y la imagen es estática, sin volúmenes.
            docker image prune -f || true

            echo "Espacio disponible en /tmp:"
            df -h /tmp

            echo "=== Cargar nueva imagen ==="
            cd /tmp
            if [ -f geminislabs-web.tar.gz ]; then
              echo "Cargando imagen Docker..."
              docker load < geminislabs-web.tar.gz

              echo "=== Verificar imagen cargada ==="
              docker images | grep geminislabs-web || echo "Advertencia: No se encontró la imagen geminislabs-web"

              echo "=== Ejecutar nuevo contenedor ==="
              docker run -d \
                --name geminislabs-web \
                --restart unless-stopped \
                -p 3330:3330 \
                -e NODE_ENV=production \
                geminislabs-web:latest

              echo "=== Verificar contenedor ==="
              docker ps | grep geminislabs-web

              echo "=== Limpiar archivos temporales ==="
              rm -f geminislabs-web.tar.gz
              find /tmp -name "geminislabs-web*.tar.gz" -mtime +1 -delete || true

              echo "=== Deployment completado exitosamente ==="
            else
              echo "Error: No se encontró el archivo geminislabs-web.tar.gz"
              exit 1
            fi
          EOF
